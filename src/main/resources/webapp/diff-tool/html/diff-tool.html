<!-- "Documents Comparison" Document Properties panel. Polarion (DiffToolFormExtension ->
  BaseFormExtension) injects this fragment into the editor's Document Properties pane and substitutes
  {PANEL_PROPS} with the panel's data as HTML-attribute-escaped JSON.

  On load the React panel bundle is imported and mounts into a SHADOW ROOT on the div below (see
  ui/src/formext/mountDiffToolPanel.tsx). It injects its own styles into that shadow root -
  react-sbb-polarion's bundled stylesheet plus ui/src/formext/diff-tool.css - so the panel's CSS is fully
  encapsulated and cannot clash with the other panels on this shared page (including this extension's own
  copy-tool panel). Neither common.css nor the generic control CSS is linked globally here any more.

  The one remaining <link> loads a tiny empty stylesheet (css/starter.css) whose only job is to fire the
  bundle import from its onload handler; an inline module <script> does not execute inside a
  GWT-injected fragment. -->
<link href='/polarion/diff-tool/ui/css/starter.css' rel='stylesheet'
      onload='import("/polarion/diff-tool-app/ui/app/assets/diffToolPanel.js")
                .then(module => module.mountDiffToolPanel("#diff-tool-panel"))
                .catch(console.error);'>

<div id="diff-tool-panel" class="comparison form-wrapper" data-props='{PANEL_PROPS}'></div>
